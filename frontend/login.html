<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — HealthGuard AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="brand" style="color:inherit;"><span class="brand-mark">❤</span> HealthGuard AI</a>
    <div class="nav-actions">
      <a href="register.html" class="btn btn-primary">Sign up</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to view your dashboard and assessments.</p>

    <div id="alert" class="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:0.9rem; color:var(--text-muted);">
      Don't have an account? <a href="register.html">Sign up</a>
    </p>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

  const form = document.getElementById('loginForm');
  const alertEl = document.getElementById('alert');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert(alertEl);

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Logging in…';

    try {
      const data = await apiRequest('/auth/login', { method: 'POST', auth: false, body: { email, password } });
      Auth.setSession(data.token, data.user);
      window.location.href = 'dashboard.html';
    } catch (err) {
      showAlert(alertEl, err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
